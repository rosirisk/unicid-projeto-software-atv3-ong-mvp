name: CI Java 21 Pipeline UNICID

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Compilar Código e Testes (.java)
      run: javac *.java

    - name: Executar Teste Unitário - Familia
      run: java FamiliaTest

    - name: Executar Teste Unitário - Doacao
      run: java DoacaoTest

    - name: Executar Teste de Integração
      run: java IntegracaoTest